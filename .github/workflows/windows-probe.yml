name: windows-probe

# Temporary diagnostic for the Windows installer work: checks that each runtime the installer
# will ship can be fetched, unpacked and started on a clean GitHub-hosted Windows machine.
# Safe to delete.

on:
  push:
    branches: [claude/nice-wright-f7jdom]
    paths: ['.github/workflows/windows-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Ollama registry - sizes of candidate models
        shell: pwsh
        continue-on-error: true
        run: |
          $cands = 'embeddinggemma:latest','embeddinggemma:300m','nomic-embed-text:latest','all-minilm:latest','mxbai-embed-large:latest','qwen3-embedding:0.6b',
            'gemma3:1b','gemma3:4b','gemma3:12b','gemma3:27b','gemma3n:e2b','gemma3n:e4b',
            'gemma4:latest','gemma4:e2b','gemma4:e4b','gemma4:12b','gemma4:26b','gemma4:31b',
            'qwen3:1.7b','qwen3:4b','qwen3:8b','llama3.2:1b','llama3.2:3b','phi4-mini:latest','qwen3.5:2b','qwen3.5:4b','qwen3.5:9b'
          $hdr = @{ Accept = 'application/vnd.docker.distribution.manifest.v2+json' }
          foreach ($c in $cands) {
            $name,$tag = $c.Split(':')
            try {
              $m = Invoke-RestMethod -Headers $hdr -Uri "https://registry.ollama.ai/v2/library/$name/manifests/$tag"
              $total = ($m.layers | Measure-Object size -Sum).Sum
              $model = $m.layers | Where-Object { $_.mediaType -eq 'application/vnd.ollama.image.model' } | Select-Object -First 1
              $cfg = Invoke-RestMethod -Uri "https://registry.ollama.ai/v2/library/$name/blobs/$($m.config.digest)"
              '{0,-26} total={1,6:N2} GB  weights={2,6:N2} GB  type={3}  quant={4}  family={5}' -f $c, ($total/1GB), ($model.size/1GB), $cfg.model_type, $cfg.file_type, $cfg.model_family
            } catch { '{0,-26} NOT AVAILABLE ({1})' -f $c, $_.Exception.Message }
          }

      - name: PostgreSQL (Maven Central build) - unpack, initdb, start, stop
        shell: pwsh
        continue-on-error: true
        run: |
          $v = '16.15.0'
          $jar = "embedded-postgres-binaries-windows-amd64-$v.jar"
          New-Item -ItemType Directory -Force -Path pg | Out-Null
          Set-Location pg
          curl.exe -sS -L --fail -o $jar "https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-windows-amd64/$v/$jar"
          'jar bytes: ' + (Get-Item $jar).Length
          New-Item -ItemType Directory -Force -Path jar | Out-Null
          tar -xf $jar -C jar
          Get-ChildItem jar -Recurse -File | Select-Object -First 15 | ForEach-Object { '{0} {1}' -f $_.FullName.Substring($PWD.Path.Length), $_.Length }
          $txz = Get-ChildItem jar -Filter *.txz -Recurse | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path out | Out-Null
          tar -xf $txz.FullName -C out
          'top level: ' + ((Get-ChildItem out | ForEach-Object Name) -join ', ')
          'bin: ' + ((Get-ChildItem out\bin -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')
          '{0:N0} MB unpacked' -f ((Get-ChildItem out -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          $bin = (Resolve-Path out\bin).Path
          & "$bin\postgres.exe" --version
          Set-Content -NoNewline -Path pw.txt -Value 'probe-password'
          & "$bin\initdb.exe" -D data -U agencyos -A scram-sha-256 --pwfile=pw.txt -E UTF8 --locale=C
          'initdb exit: ' + $LASTEXITCODE
          $env:PGPASSWORD = 'probe-password'
          & "$bin\pg_ctl.exe" -D data -l pg.log -o "-p 54329 -c listen_addresses=127.0.0.1" -w -t 60 start
          'pg_ctl start exit: ' + $LASTEXITCODE
          if (Test-Path "$bin\psql.exe") {
            & "$bin\psql.exe" -h 127.0.0.1 -p 54329 -U agencyos -d postgres -c "select version()"
            & "$bin\psql.exe" -h 127.0.0.1 -p 54329 -U agencyos -d postgres -c "create database agencyos"
          } else { 'no psql.exe in this build' }
          & "$bin\pg_ctl.exe" -D data -m fast -w stop
          'pg_ctl stop exit: ' + $LASTEXITCODE
          Get-Content pg.log -Tail 15

      - name: PostgreSQL (EnterpriseDB build) - layout
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path edb | Out-Null
          Set-Location edb
          curl.exe -sS -L --fail -o pg.zip 'https://get.enterprisedb.com/postgresql/postgresql-16.9-1-windows-x64-binaries.zip'
          'zip bytes: ' + (Get-Item pg.zip).Length
          tar -xf pg.zip
          Get-ChildItem pgsql | ForEach-Object { '{0,-16} {1:N0} MB' -f $_.Name, ((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1MB) }
          'bin: ' + ((Get-ChildItem pgsql\bin -Filter *.exe | ForEach-Object Name) -join ', ')

      - name: Redis for Windows - unpack and run
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'agencyos-probe' }
          $rel = Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/repos/redis-windows/redis-windows/releases/latest'
          $a = $rel.assets | Where-Object { $_.name -like '*Windows-x64-msys2.zip' } | Select-Object -First 1
          $a.name
          New-Item -ItemType Directory -Force -Path redis | Out-Null
          Set-Location redis
          curl.exe -sS -L --fail -o r.zip $a.browser_download_url
          tar -xf r.zip
          Get-ChildItem -Recurse -File | ForEach-Object { '{0} {1}' -f $_.FullName.Substring($PWD.Path.Length), $_.Length }
          $exe = Get-ChildItem -Recurse -Filter redis-server.exe | Select-Object -First 1
          & $exe.FullName --version
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--port','6390','--bind','127.0.0.1','--save','""','--appendonly','no' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $cli = Get-ChildItem -Recurse -Filter redis-cli.exe | Select-Object -First 1
          if ($cli) { & $cli.FullName -p 6390 ping; & $cli.FullName -p 6390 info server | Select-String redis_version }
          else { $c = New-Object Net.Sockets.TcpClient('127.0.0.1', 6390); $s = $c.GetStream(); $b = [Text.Encoding]::ASCII.GetBytes("PING`r`n"); $s.Write($b,0,$b.Length); Start-Sleep -Milliseconds 300; $buf = New-Object byte[] 64; $n = $s.Read($buf,0,64); [Text.Encoding]::ASCII.GetString($buf,0,$n) }
          Stop-Process -Id $p.Id -Force

      - name: Temporal CLI - unpack and run dev server
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'agencyos-probe' }
          $rel = Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/repos/temporalio/cli/releases/latest'
          $a = $rel.assets | Where-Object { $_.name -like '*_windows_amd64.zip' } | Select-Object -First 1
          $a.name
          New-Item -ItemType Directory -Force -Path temporal | Out-Null
          Set-Location temporal
          curl.exe -sS -L --fail -o t.zip $a.browser_download_url
          tar -xf t.zip
          Get-ChildItem -Recurse -File | ForEach-Object { '{0} {1}' -f $_.FullName.Substring($PWD.Path.Length), $_.Length }
          .\temporal.exe --version
          $p = Start-Process -FilePath .\temporal.exe -ArgumentList 'server','start-dev','--ip','127.0.0.1','--port','7233','--headless','--db-filename','temporal.db','--log-level','warn' -PassThru -WindowStyle Hidden -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep -Seconds 1; try { $c = New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 7233); $c.Close(); $ok = $true; break } catch {} }
          'temporal port 7233 open after ~' + $i + 's: ' + $ok
          if ($ok) { .\temporal.exe operator namespace list --address 127.0.0.1:7233 }
          Stop-Process -Id $p.Id -Force
          Get-Content out.log -Tail 5 -ErrorAction SilentlyContinue
          Get-Content err.log -Tail 5 -ErrorAction SilentlyContinue

      - name: Ollama - download zip, layout, serve, pull EmbeddingGemma, embed
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ollama | Out-Null
          Set-Location ollama
          'range test: ' + (curl.exe -sS -L -r 0-1048575 -o NUL -w '%{http_code} %{size_download}' https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          curl.exe -sS -L --fail -o o.zip https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip
          'download: {0:N0} MB in {1:N0}s' -f ((Get-Item o.zip).Length / 1MB), $sw.Elapsed.TotalSeconds
          $sw.Restart()
          New-Item -ItemType Directory -Force -Path app | Out-Null
          tar -xf o.zip -C app
          'extract: {0:N0}s' -f $sw.Elapsed.TotalSeconds
          Get-ChildItem app | ForEach-Object { '{0,-24} {1:N0} MB' -f $_.Name, ((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1MB) }
          if (Test-Path app\lib\ollama) { Get-ChildItem app\lib\ollama | ForEach-Object { '  lib/ollama/{0,-22} {1:N0} MB' -f $_.Name, ((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1MB) } }
          $exe = (Resolve-Path app\ollama.exe).Path
          & $exe --version
          $env:OLLAMA_HOST = '127.0.0.1:11499'
          $env:OLLAMA_MODELS = (Join-Path $PWD 'models')
          $p = Start-Process -FilePath $exe -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput serve.log -RedirectStandardError serve.err
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep -Seconds 1; try { Invoke-RestMethod -Uri 'http://127.0.0.1:11499/api/version' | Out-Null; $ok = $true; break } catch {} }
          'serve up after ~' + $i + 's: ' + $ok
          (Invoke-RestMethod -Uri 'http://127.0.0.1:11499/api/version').version
          $sw.Restart()
          $pull = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:11499/api/pull' -Body (@{ model = 'embeddinggemma'; stream = $false } | ConvertTo-Json) -ContentType 'application/json' -TimeoutSec 900
          'pull embeddinggemma: ' + $pull.status + ' in {0:N0}s' -f $sw.Elapsed.TotalSeconds
          $sw.Restart()
          $e = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:11499/api/embed' -Body (@{ model = 'embeddinggemma'; input = @('hello agency', 'campaign for a bakery') } | ConvertTo-Json) -ContentType 'application/json' -TimeoutSec 300
          'embed: {0} vectors of {1} dims in {2:N1}s' -f $e.embeddings.Count, $e.embeddings[0].Count, $sw.Elapsed.TotalSeconds
          Invoke-RestMethod -Uri 'http://127.0.0.1:11499/api/show' -Method Post -Body (@{ model = 'embeddinggemma' } | ConvertTo-Json) -ContentType 'application/json' | Select-Object -ExpandProperty details | Format-List
          Stop-Process -Id $p.Id -Force
          Get-Content serve.err -Tail 12 -ErrorAction SilentlyContinue

      - name: Node zip, .NET compiler
        shell: pwsh
        continue-on-error: true
        run: |
          $sums = Invoke-RestMethod -Uri 'https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt'
          ($sums -split "`n" | Where-Object { $_ -match 'win-x64\.zip|win-arm64\.zip' }) -join "`n"
          foreach ($c in 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe','C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe') { '{0} exists={1}' -f $c, (Test-Path $c) }
          $cs = 'using System; static class P { [STAThread] static void Main() { Console.WriteLine("hello"); } }'
          Set-Content -Path hello.cs -Value $cs
          & 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe' /nologo /target:winexe /out:hello.exe hello.cs
          'csc exit: ' + $LASTEXITCODE + ' exe exists: ' + (Test-Path hello.exe)
