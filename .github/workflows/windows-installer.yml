name: windows-installer

# Builds the AgencyOS Windows installer, installs it on a clean Windows machine, starts the
# desktop app, and checks that the product and its local AI really work. A release is only
# published from a run that passed that test, and only when asked for (workflow_dispatch with
# publish = true).
#
# Code signing: the installer and the app are signed when a certificate is configured (see
# docs/AGENCYOS_SIGNING.md), and the smoke test then checks that Windows accepts the signature.
# Without one the build is unsigned, says so, and still passes.

on:
  push:
    branches: [master]
    paths:
      - 'installer/**'
      - 'apps/**'
      - 'libraries/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release if the smoke test passes'
        type: boolean
        default: false
      skip_ai:
        description: 'Skip the local AI part of the smoke test (faster; do not publish from such a run)'
        type: boolean
        default: false
      sign_selftest:
        description: 'Prove the signing steps with a throwaway certificate made on the runner (never published)'
        type: boolean
        default: false

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 170
    permissions:
      contents: read
      # Only used to sign in to Azure Artifact Signing without a stored secret, when it is set up.
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content installer/VERSION).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          "VERSION=$v" >> $env:GITHUB_ENV
          "Building AgencyOS $v from $env:GITHUB_SHA"

      - name: Signing mode
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          # none: unsigned. azure: Azure Artifact Signing. pfx: a certificate file. selftest: proves
          # the steps with a throwaway certificate (never published).
          $mode = 'none'
          if ('${{ inputs.sign_selftest }}' -eq 'true') {
            $mode = 'selftest'
            if ('${{ inputs.publish }}' -eq 'true') { throw 'A self-test signature is not a real one: do not publish from it.' }
          } elseif ($env:AZURE_CLIENT_ID -and $env:AZURE_TENANT_ID -and $env:AZURE_SUBSCRIPTION_ID -and $env:ARTIFACT_SIGNING_ENDPOINT -and $env:ARTIFACT_SIGNING_ACCOUNT -and $env:ARTIFACT_SIGNING_PROFILE) {
            $mode = 'azure'
          } elseif ($env:WINDOWS_PFX_BASE64) {
            $mode = 'pfx'
          }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "SIGNING_MODE=$mode" >> $env:GITHUB_ENV
          "Code signing: $mode"

      - name: Throwaway certificate (self-test only)
        if: steps.signing.outputs.mode == 'selftest'
        shell: powershell
        run: |
          # Windows PowerShell: the certificate cmdlets live there. The certificate is trusted on
          # this runner only, so the check below can say Valid; it means nothing anywhere else.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=AgencyOS pipeline self-test (not a real signature)' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(2)
          $password = [guid]::NewGuid().ToString('N')
          "::add-mask::$password"
          $pfx = Join-Path $env:RUNNER_TEMP 'selftest.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'selftest.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          # Windows PowerShell's > and >> write UTF-16, which the runner cannot read.
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SIGN_PFX=$pfx`nSIGN_PFX_PASSWORD=$password`n")

      - name: Certificate file
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "SIGN_PFX_PASSWORD=$env:WINDOWS_PFX_PASSWORD" >> $env:GITHUB_ENV

      - name: Sign in to Azure (code signing)
        if: steps.signing.outputs.mode == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Changelog covers this version
        shell: pwsh
        run: |
          # A release without notes is refused; CHANGELOG.md must match releases.json.
          node installer/build/changelog.mjs --notes $env:VERSION | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node installer/build/changelog.mjs --check
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Unit tests (launcher, model selection, desktop shell policy)
        shell: pwsh
        run: |
          node --test installer/launcher/test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test installer/desktop/test/policy.test.js

      - name: Install pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.6.1 --activate
          pnpm --version

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build backend, orchestrator and the standalone frontend
        shell: pwsh
        env:
          AGENCYOS_STANDALONE: 'true'
          STORAGE_PROVIDER: local
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm run build

      - name: Stage the application (and prove every compiled file loads)
        shell: pwsh
        run: node installer/build/stage-app.mjs --out installer/dist/stage --platform win32 --verify

      - name: Stage Node, PostgreSQL, Redis, Temporal (and prove each starts)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node installer/build/stage-runtime.mjs --out installer/dist/stage --version $env:VERSION

      - name: Build the desktop shell (Electron)
        shell: pwsh
        run: |
          node installer/build/make-icons.mjs --out installer/desktop/assets
          npx --yes '@electron/packager@20.3.0' installer/desktop AgencyOS --platform=win32 --arch=x64 --electron-version=44.7.0 --out=installer/dist/desktop --overwrite --asar --icon=installer/desktop/assets/icon.ico "--app-version=$env:VERSION" "--build-version=$env:VERSION" "--win32metadata.CompanyName=NextGen OS" --win32metadata.FileDescription=AgencyOS --win32metadata.ProductName=AgencyOS --win32metadata.OriginalFilename=AgencyOS.exe '--ignore=^/test'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "installer/dist/desktop/AgencyOS-win32-x64/*" installer/dist/stage -Recurse -Force
          Get-ChildItem installer/dist/stage | Select-Object -First 40 | ForEach-Object { $_.Name }

      - name: Sign the app (Azure Artifact Signing)
        if: steps.signing.outputs.mode == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\installer\dist\stage\AgencyOS.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the app (certificate file)
        if: steps.signing.outputs.mode == 'pfx' || steps.signing.outputs.mode == 'selftest'
        shell: pwsh
        run: |
          $extra = @{}
          if ($env:SIGNING_MODE -eq 'selftest') { $extra['NoTimestamp'] = $true }
          ./installer/windows/sign.ps1 -Files "$PWD\installer\dist\stage\AgencyOS.exe" -Pfx $env:SIGN_PFX -Password $env:SIGN_PFX_PASSWORD @extra

      - name: Size of what will be installed
        shell: pwsh
        run: |
          $s = Get-ChildItem installer/dist/stage -Recurse -File | Measure-Object Length -Sum
          '{0:N0} files, {1:N0} MB' -f $s.Count, ($s.Sum / 1MB)

      - name: Compile the installer (Inno Setup)
        shell: pwsh
        run: |
          # Test builds compress fast; a build made to be published compresses as small as it can.
          $compression = 'lzma2/fast'
          if ('${{ inputs.publish }}' -eq 'true') { $compression = 'lzma2/max' }
          "compression: $compression"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:VERSION.0" "/DCompression=$compression" "/DStageDir=$PWD\installer\dist\stage" "/DOutDir=$PWD\installer\dist\out" "/DIconFile=$PWD\installer\desktop\assets\icon.ico" installer\windows\agencyos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer/dist/out | ForEach-Object { '{0}  {1:N0} MB' -f $_.Name, ($_.Length / 1MB) }

      - name: Sign the installer (Azure Artifact Signing)
        if: steps.signing.outputs.mode == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installer\dist\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the installer (certificate file)
        if: steps.signing.outputs.mode == 'pfx' || steps.signing.outputs.mode == 'selftest'
        shell: pwsh
        run: |
          $extra = @{}
          if ($env:SIGNING_MODE -eq 'selftest') { $extra['NoTimestamp'] = $true }
          $exe = (Get-ChildItem installer/dist/out/*.exe | Select-Object -First 1).FullName
          ./installer/windows/sign.ps1 -Files $exe -Pfx $env:SIGN_PFX -Password $env:SIGN_PFX_PASSWORD @extra

      - name: Checksum (of the file people will download, after signing)
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/dist/out/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii "installer/dist/out/$($exe.Name).sha256"
          "sha256 $hash"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AgencyOS-Setup
          path: |
            installer/dist/out/*.exe
            installer/dist/out/*.sha256
          retention-days: 14
          compression-level: 0

      - name: Smoke test (install, start the desktop app, use the product, local AI, restart, uninstall)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem installer/dist/out/*.exe | Select-Object -First 1).FullName
          $flags = @()
          if ('${{ inputs.skip_ai }}' -eq 'true') { $flags += '--skip-ai' }
          node installer/windows/smoke-test.mjs --installer $exe --artifacts smoke-artifacts --signing $env:SIGNING_MODE @flags

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: smoke-artifacts
          retention-days: 14
          if-no-files-found: warn

  release:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.skip_ai
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AgencyOS-Setup
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: smoke-artifacts
          path: evidence

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          set -euo pipefail
          tag="windows-v${VERSION}"
          exe=$(ls release/*.exe | head -n 1)
          sha=$(cut -d' ' -f1 "$exe.sha256")
          node installer/build/release-notes.mjs --version "$VERSION" --sha256 "$sha" --commit "$GITHUB_SHA" --report evidence/smoke-report.json --template installer/RELEASE_NOTES.md > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$exe" "$exe.sha256" --clobber
            gh release edit "$tag" --title "AgencyOS ${VERSION} for Windows" --notes-file notes.md
          else
            gh release create "$tag" "$exe" "$exe.sha256" --title "AgencyOS ${VERSION} for Windows" --notes-file notes.md --target "$GITHUB_SHA"
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[] | "\(.name)  \(.size) bytes")'
