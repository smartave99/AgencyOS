<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgencyOS</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --text: #1d1d1f; --sub: #6e6e73; --accent: #6d4aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0f; --text: #f5f5f7; --sub: #9a9aa3; --accent: #8b6cff; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  main { text-align: center; padding: 24px; }
  img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 10px 30px rgba(109, 74, 255, .35); animation: rise .5s ease both; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; margin: 22px 0 6px; }
  p { color: var(--sub); margin: 0; }
  .bar { width: 160px; height: 4px; border-radius: 2px; margin: 22px auto 0; background: rgba(127, 127, 127, .25); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .6; } img { animation: none; } }
</style>
</head>
<body>
  <main>
    <img src="assets/icon.png" alt="">
    <h1>AgencyOS</h1>
    <p>Starting on this computer…</p>
    <div class="bar" role="progressbar" aria-label="Starting"><i></i></div>
  </main>
</body>
</html>
